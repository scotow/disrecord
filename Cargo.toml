[package]
name = "disrecord"
version = "0.3.6"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
bincode = "=1.3.3"
clap = { version = "4.6.1", features = ["derive"] }
emojis = "0.8.2"
env_logger = "0.11.10"
humantime = "2.3.0"
itertools = "0.14.0"
log = "0.4.29"
log-panics = "2.1.0"
parse_duration = "2.1.1"
rand = "0.10.1"
regex = "1.12.3"
rustls = "0.23.40"
symphonia = { version = "0.5.4", default-features = false, features = ["pcm", "wav"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "utils", "rustls_backend", "voice"] }
songbird = { version = "0.6.0", features = ["receive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "macros", "process", "rt-multi-thread", "sync"] }
ulid = { version = "1.2.1", features = ["serde"] }
zip = { version = "0.6.6", default-features = false }